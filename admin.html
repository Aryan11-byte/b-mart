<!DOCTYPE html>
<html>
<head>
<title>B Mart Admin Panel</title>
<link rel="stylesheet" href="style.css">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore, collection, getDocs, doc, updateDoc 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 PASTE YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔐 SIMPLE ADMIN PROTECTION
if(localStorage.getItem("admin") !== "true"){
    alert("Access Denied! Login First");
    window.location = "login.html";
}

// LOAD ORDERS
async function loadOrders(){
    const querySnapshot = await getDocs(collection(db, "orders"));
    let container = document.getElementById("orders");

    container.innerHTML = "";

    querySnapshot.forEach((docSnap)=>{
        let data = docSnap.data();

        let itemsHTML = "";
        if(data.items){
            data.items.forEach(item=>{
                itemsHTML += `<li>${item.name} - ₹${item.price}</li>`;
            });
        }

        container.innerHTML += `
        <div class="card">
            <h3>Order ID: ${docSnap.id}</h3>
            <p><b>Name:</b> ${data.name}</p>
            <p><b>Address:</b> ${data.address}</p>

            <p><b>Items:</b></p>
            <ul>${itemsHTML}</ul>

            <p><b>Status:</b> ${data.status}</p>

            <select onchange="updateStatus('${docSnap.id}', this.value)">
                <option value="">Update Status</option>
                <option value="Processing">Processing</option>
                <option value="Out for Delivery">Out for Delivery</option>
                <option value="Delivered">Delivered</option>
            </select>
        </div>
        <br>
        `;
    });
}

// UPDATE STATUS
window.updateStatus = async function(id, newStatus){
    if(newStatus === "") return;

    await updateDoc(doc(db, "orders", id), {
        status: newStatus
    });

    alert("Status Updated ✅");
    loadOrders();
}

// LOAD ON START
window.onload = loadOrders;

</script>

</head>

<body>

<header>
<div class="logo">B Mart Admin</div>
<nav>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="track.html">Track</a>
</nav>
</header>

<div class="container">
<h2>All Orders 📦</h2>
<div id="orders"></div>
</div>

</body>
</html>
