<!DOCTYPE html>
<html>
<head>
<title>B Mart</title>
<link rel="stylesheet" href="style.css">

<!-- ✅ Favicon fix -->
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2331/2331970.png">

<!-- ✅ IMPORTANT: module script -->
<script type="module" src="app.js"></script>
</head>

<body>

<header>
<div class="logo">B Mart</div>
<nav>
<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="cart.html">Cart</a>
<a href="track.html">Track Order</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<!-- HERO -->
<div class="hero">
<h1>Groceries Delivered in Minutes ⚡</h1>
<p>Fresh groceries, snacks & essentials at your doorstep</p>
<a href="shop.html"><button>Start Shopping</button></a>
</div>

<!-- CATEGORIES -->
<div class="container">
<h2>Shop by Category 🛒</h2>

<div class="grid">

<div class="product">
<img src="https://source.unsplash.com/200x200/?fruits">
<h3>Fruits</h3>
</div>

<div class="product">
<img src="https://source.unsplash.com/200x200/?vegetables">
<h3>Vegetables</h3>
</div>

<div class="product">
<img src="https://source.unsplash.com/200x200/?dairy">
<h3>Dairy</h3>
</div>

<div class="product">
<img src="https://source.unsplash.com/200x200/?snacks">
<h3>Snacks</h3>
</div>

</div>
</div>

<!-- PRODUCTS -->
<div class="container">
<h2>Popular Products 🔥</h2>

<div class="grid">

<div class="product">
<img src="https://source.unsplash.com/200x200/?milk">
<h3>Milk</h3>
<p>₹50</p>
<button onclick="addToCart('Milk',50)">Add to Cart</button>
</div>

<div class="product">
<img src="https://source.unsplash.com/200x200/?bread">
<h3>Bread</h3>
<p>₹30</p>
<button onclick="addToCart('Bread',30)">Add to Cart</button>
</div>

<div class="product">
<img src="https://source.unsplash.com/200x200/?eggs">
<h3>Eggs</h3>
<p>₹80</p>
<button onclick="addToCart('Eggs',80)">Add to Cart</button>
</div>

</div>
</div>

<!-- FOOTER -->
<footer>
<p>© 2026 B Mart | All Rights Reserved</p>
</footer>

</body>
</html>
